server {
    listen 80;
    server_name backend.ayahosni.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backend.ayahosni.com;

    ssl_certificate /etc/letsencrypt/live/backend.ayahosni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.ayahosni.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/portfolio/dist/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
