name: Deploy Portfolio

# Deploys the Dockerised site: the server pulls the latest code and rebuilds the container
# (the Dockerfile builds the Angular app and serves it with nginx inside the image).
on:
  push:
    branches: [master]
  workflow_dispatch:        # lets you re-run a deploy by hand from the Actions tab

# never run two deploys at once; a newer push waits for the one in progress
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true            # stop at the first failing command
          script: |
            set -e
            APP_DIR=/var/www/portfolio

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "::error::$APP_DIR is not a git clone of the repo. Clone it there first."
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin master
            git merge --ff-only origin/master      # fails loudly if the server copy has diverged

            docker compose up -d --build --remove-orphans
            docker compose ps

            # clean up images left over from previous builds
            docker image prune -f
