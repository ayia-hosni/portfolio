name: Deploy Portfolio

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.HETZNER_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload to staging directory
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/portfolio-ng/browser/
          remote_path: /var/www/portfolio/dist/portfolio_new/
          remote_host: ${{ secrets.HETZNER_HOST }}
          remote_user: ${{ secrets.HETZNER_USER }}
          remote_key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Atomic swap (zero downtime)
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            mv /var/www/portfolio/dist/portfolio /var/www/portfolio/dist/portfolio_old
            mv /var/www/portfolio/dist/portfolio_new /var/www/portfolio/dist/portfolio
            rm -rf /var/www/portfolio/dist/portfolio_old
          "
