<nav [class.scrolled]="scrolled()">
  <div class="logo" aria-label="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
    </svg>
  </div>

  <div class="nav-center">
    <div class="nav-links">
      <a (click)="scrollTo('about')">About</a>
      <a (click)="scrollTo('work')">Projects</a>
      <a (click)="scrollTo('stack')">Stack</a>
      <a (click)="scrollTo('contact')">Contact</a>
    </div>

    <div class="avail-badge">
      <span class="dot"></span>
      Available
    </div>
  </div>

  <div class="nav-actions">
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="dark() ? 'Switch to light' : 'Switch to dark'">
      @if (!dark()) {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>
    <button class="cta" (click)="scrollTo('contact')">
      Get In Touch
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7h10v10"/><path d="M7 17 17 7"/>
      </svg>
    </button>
  </div>
</nav>
